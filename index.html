<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法の砂時計｜ポモドーロ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif; }
  body {
    background: radial-gradient(circle at 50% 32%, #eef6fc 0%, #dcecf6 48%, #c9def0 100%);
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; cursor:pointer;
  }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, MIN;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  MIN = Math.min(W, H);
}
resize();
window.addEventListener('resize', resize);

// ===== タイマー状態 =====
const DUR = { work: 25*60, break: 5*60 };
let mode = 'work';
let remaining = DUR.work;
let running = false;
let sessions = 0;
let flash = 0;          // 切替フラッシュ
let started = false;    // 一度でも開始したか

function fmt(s){
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s/60), ss = s%60;
  return String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}

// 操作
canvas.addEventListener('click', ()=>{ running = !running; if(running) started = true; });
canvas.addEventListener('dblclick', ()=>{ running=false; remaining=DUR[mode]; });

// ===== 星屑 =====
const stars = [];
for(let i=0;i<40;i++){
  stars.push({
    x: Math.random(), y: Math.random(),
    r: 0.6 + Math.random()*1.6,
    ph: Math.random()*Math.PI*2,
    sp: 0.3 + Math.random()*0.7
  });
}

// ===== 落下する魔法の粒 =====
let grains = [];

// ===== 時間進行 =====
let last = performance.now();
function step(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.1) dt = 0.1;
  if(running){
    remaining -= dt;
    if(remaining <= 0){
      if(mode==='work'){ mode='break'; sessions++; }
      else { mode='work'; }
      remaining = DUR[mode];
      flash = 1;
    }
  }
  if(flash > 0) flash = Math.max(0, flash - dt*1.2);
  draw(now/1000, dt);
  requestAnimationFrame(step);
}

function lerp(a,b,t){ return a + (b-a)*t; }

function draw(t, dt){
  ctx.clearRect(0,0,W,H);

  // 星屑
  for(const s of stars){
    const a = 0.25 + 0.35*(0.5+0.5*Math.sin(t*s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  // 砂時計の寸法
  const cx = W/2;
  const topY = H*0.20, botY = H*0.74;
  const midY = (topY+botY)/2;
  const half = MIN*0.19;     // 上下の最大半幅
  const neck = MIN*0.016;    // くびれ半幅

  const isWork = (mode==='work');
  const sandTop = isWork ? '#bfe0fa' : '#cfeede';
  const sandBot = isWork ? '#7fbbe8' : '#8fd0b0';
  const glass   = '#5a8fb5';

  const p = remaining / DUR[mode];   // 1→0

  // ---- 上の砂（台形・上から減る） ----
  const wAtTop = (y)=> lerp(half, neck, (y-topY)/(midY-topY));
  const yTop = lerp(topY, midY, 1-p);
  ctx.beginPath();
  ctx.moveTo(cx - wAtTop(yTop), yTop);
  ctx.lineTo(cx + wAtTop(yTop), yTop);
  ctx.lineTo(cx + neck, midY);
  ctx.lineTo(cx - neck, midY);
  ctx.closePath();
  let g1 = ctx.createLinearGradient(0, yTop, 0, midY);
  g1.addColorStop(0, sandTop); g1.addColorStop(1, sandBot);
  ctx.fillStyle = g1; ctx.fill();

  // ---- 下の砂（台形・下に積もる） ----
  const wAtBot = (y)=> lerp(neck, half, (y-midY)/(botY-midY));
  const yBot = lerp(botY, midY, 1-p);
  ctx.beginPath();
  ctx.moveTo(cx - wAtBot(yBot), yBot);
  ctx.lineTo(cx + wAtBot(yBot), yBot);
  ctx.lineTo(cx + half, botY);
  ctx.lineTo(cx - half, botY);
  ctx.closePath();
  let g2 = ctx.createLinearGradient(0, yBot, 0, botY);
  g2.addColorStop(0, sandTop); g2.addColorStop(1, sandBot);
  ctx.fillStyle = g2; ctx.fill();

  // ---- 落下する魔法の粒 ----
  if(running && p > 0.001){
    if(Math.random() < 0.6){
      grains.push({ x: cx + (Math.random()-0.5)*neck*1.5, y: midY, v: 1.2+Math.random()*1.5, life:1 });
    }
  }
  for(let i=grains.length-1;i>=0;i--){
    const gr = grains[i];
    gr.y += gr.v; gr.v += 0.15;
    if(gr.y >= yBot || gr.y > botY){ grains.splice(i,1); continue; }
    ctx.beginPath();
    ctx.arc(gr.x, gr.y, 1.6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(220,240,255,0.95)';
    ctx.fill();
  }

  // ---- ガラスの輪郭 ----
  ctx.lineWidth = Math.max(2, MIN*0.006);
  ctx.strokeStyle = glass;
  ctx.lineJoin = 'round';
  // 上
  ctx.beginPath();
  ctx.moveTo(cx-half, topY); ctx.lineTo(cx+half, topY);
  ctx.lineTo(cx+neck, midY); ctx.lineTo(cx+half, botY);
  ctx.lineTo(cx-half, botY); ctx.lineTo(cx-neck, midY);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fill();
  ctx.stroke();

  // ---- 上下のフタ（魔法陣） ----
  function cap(y){
    const cw = half*1.25, ch = MIN*0.018;
    ctx.beginPath();
    ctx.ellipse(cx, y, cw, ch*1.6, 0, 0, Math.PI*2);
    ctx.fillStyle = '#4a7fa5'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#cfe6f5';
    ctx.beginPath();
    ctx.ellipse(cx, y, cw*0.7, ch*1.0, 0, 0, Math.PI*2); ctx.stroke();
    for(let k=0;k<8;k++){
      const ang = k/8*Math.PI*2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang)*cw*0.7, y + Math.sin(ang)*ch*1.0, 1.2, 0, Math.PI*2);
      ctx.fillStyle = '#dff0ff'; ctx.fill();
    }
  }
  cap(topY - MIN*0.02);
  cap(botY + MIN*0.02);

  // ---- フラッシュ（切替時） ----
  if(flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash*0.5})`;
    ctx.fillRect(0,0,W,H);
  }

  // ---- テキスト ----
  ctx.textAlign = 'center';
  ctx.fillStyle = '#36617f';
  ctx.font = `600 ${MIN*0.13}px 'Hiragino Sans',sans-serif`;
  ctx.fillText(fmt(remaining), cx, H*0.90);

  ctx.font = `500 ${MIN*0.045}px 'Hiragino Sans',sans-serif`;
  ctx.fillStyle = isWork ? '#4a7fa5' : '#4a9f78';
  const label = isWork ? '✦ 集中' : '✦ 休憩';
  ctx.fillText(label, cx, H*0.965);

  // セッション数
  if(sessions>0){
    ctx.font = `500 ${MIN*0.035}px 'Hiragino Sans',sans-serif`;
    ctx.fillStyle = '#7a9cb5';
    ctx.fillText('☾'.repeat(Math.min(sessions,8)), cx, H*0.085);
  }

  // 開始前の案内
  if(!started){
    ctx.font = `500 ${MIN*0.035}px 'Hiragino Sans',sans-serif`;
    ctx.fillStyle = 'rgba(90,143,181,0.8)';
    ctx.fillText('タップで集中スタート', cx, H*0.12);
  }
}

requestAnimationFrame(step);
</script>
</body>
</html>
